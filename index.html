<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLESSIE MANAGEMENT SYSTEM</title>
<style>
:root{
  --green:#16843f;--green2:#0f6d32;--green-soft:#eaf8ef;
  --blue:#2563eb;--red:#dc2626;--orange:#d97706;
  --ink:#172033;--muted:#718096;--bg:#f5f7fb;--card:#fff;--line:#e5e9f0;
  --shadow:0 8px 25px rgba(20,30,50,.06);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:22px 16px;z-index:20;overflow:auto}
.brand{padding:0 10px 24px}.brand h1{font-size:22px}.brand p{font-size:12px;color:#8a94a6;margin-top:5px;letter-spacing:.5px}
.nav-title{font-size:11px;color:#9aa3b2;text-transform:uppercase;letter-spacing:1px;margin:18px 10px 8px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;color:#344054;margin:2px 0;display:flex;gap:10px;align-items:center}
.nav button:hover{background:#f4f7f5}.nav button.active{background:var(--green-soft);color:var(--green2);font-weight:700}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.topbar .title{font-weight:700}.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px}
.admin{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px}
.content{padding:28px;max-width:1600px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h2{font-size:27px}.page-head p{color:var(--muted);font-size:13px;margin-top:5px}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700}.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}.btn-light{background:#fff;border:1px solid var(--line);color:#344054}.btn-danger{background:#fee2e2;color:#b91c1c;border:0}.btn-blue{background:#dbeafe;color:#1d4ed8;border:0}
.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.stat-label{font-size:13px;color:#667085}.stat-value{font-size:27px;font-weight:800;margin-top:9px}.green{color:var(--green)}.blue{color:var(--blue)}.red{color:var(--red)}.orange{color:var(--orange)}
.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.section-title{font-weight:800;font-size:16px;margin-bottom:15px}
.empty{text-align:center;color:#9aa3b2;padding:42px 15px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:#667085;font-size:12px;background:#fafbfc}.table tr:hover td{background:#fbfcfd}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.badge-green{background:#dcfce7;color:#15803d}.badge-red{background:#fee2e2;color:#b91c1c}.badge-orange{background:#ffedd5;color:#c2410c}.badge-blue{background:#dbeafe;color:#1d4ed8}.badge-gray{background:#eef2f7;color:#667085}
.actions{display:flex;gap:7px;flex-wrap:wrap}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid.three-col{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:9px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-box{background:#fff;border-radius:17px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{font-size:19px}.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:240px}
.kpi{font-size:12px;color:var(--muted)}.money{font-weight:800}
.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:12px;margin-bottom:15px}
.mobile-toggle{display:none;border:0;background:#fff;font-size:22px}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:15px}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:42px;background:var(--green);border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:10px;color:#8a94a6}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick-grid button{padding:14px 10px;border:1px solid var(--line);background:#fff;border-radius:11px;text-align:left}.quick-grid b{display:block;margin-top:5px}.small{font-size:11px;color:var(--muted)}
.footer-note{font-size:11px;color:#98a2b3;margin-top:25px;text-align:center}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-toggle{display:block}.topbar{padding:0 15px}.content{padding:18px}.stats{grid-template-columns:1fr 1fr}.form-grid,.form-grid.three-col{grid-template-columns:1fr}.search{min-width:0;width:100%}.page-head{align-items:flex-start;flex-direction:column}.modal-box{padding:17px}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><h1>BLESSIE</h1><p>MANAGEMENT SYSTEM</p></div>
  <div class="nav-title">Utama</div>
  <nav class="nav">
    <button data-page="dashboard">🏠 Dashboard</button>
  </nav>
  <div class="nav-title">Inventory</div>
  <nav class="nav">
    <button data-page="materials">📦 Bahan Baku</button>
    <button data-page="incoming">📥 Bahan Masuk</button>
    <button data-page="outgoing">📤 Bahan Keluar</button>
    <button data-page="stock">🔄 Stock Opname</button>
    <button data-page="history">📋 Riwayat Stok</button>
  </nav>
  <div class="nav-title">Penjualan</div>
  <nav class="nav">
    <button data-page="sales">🛒 Penjualan</button>
    <button data-page="products">🏷️ Produk & Jasa</button>
  </nav>
  <div class="nav-title">Keuangan</div>
  <nav class="nav">
    <button data-page="expenses">💸 Pengeluaran</button>
    <button data-page="reports">📊 Laporan</button>
  </nav>
  <div class="nav-title">Sistem</div>
  <nav class="nav">
    <button data-page="settings">⚙️ Pengaturan</button>
  </nav>
</aside>

<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="mobile-toggle" id="mobileToggle">☰</button>
    <div><div class="title" id="topTitle">Dashboard</div><div class="sub" id="todayText"></div></div>
  </div>
  <button class="admin">👤 BLESSIE ADMIN</button>
</header>
<div class="content" id="content"></div>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const KEY='blessie_management_v2';
const defaultState={
  materials:[],
  incoming:[],
  outgoing:[],
  stockOpname:[],
  sales:[],
  products:[],
  expenses:[],
  settings:{businessName:'BLESSIE PRINTING',lowStockDefault:5}
};
let state=loadState();
let currentPage='dashboard';

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return structuredClone(defaultState);
    const x=JSON.parse(raw);
    return {...structuredClone(defaultState),...x};
  }catch(e){return structuredClone(defaultState)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function num(n){return Number(n)||0}
function dateID(d){return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function nowDate(){return new Date().toISOString().slice(0,10)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function materialStock(m){
  const masuk=state.incoming.filter(x=>x.materialId===m.id).reduce((a,x)=>a+num(x.qty),0);
  const keluar=state.outgoing.filter(x=>x.materialId===m.id).reduce((a,x)=>a+num(x.qty),0);
  const opname=state.stockOpname.filter(x=>x.materialId===m.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const base=num(m.initialStock);
  let stock=base+masuk-keluar;
  if(opname) stock=num(opname.actualStock)+(state.incoming.filter(x=>x.materialId===m.id && new Date(x.date)>new Date(opname.date)).reduce((a,x)=>a+num(x.qty),0))-state.outgoing.filter(x=>x.materialId===m.id && new Date(x.date)>new Date(opname.date)).reduce((a,x)=>a+num(x.qty),0);
  return stock;
}
function allRevenue(){return state.sales.reduce((a,x)=>a+num(x.total),0)}
function allExpenses(){return state.expenses.reduce((a,x)=>a+num(x.amount),0)}
function todayRevenue(){const d=nowDate();return state.sales.filter(x=>x.date===d).reduce((a,x)=>a+num(x.total),0)}
function todayExpenses(){const d=nowDate();return state.expenses.filter(x=>x.date===d).reduce((a,x)=>a+num(x.amount),0)}
function pageTitle(p){
 const map={dashboard:'Dashboard',materials:'Bahan Baku',incoming:'Bahan Masuk',outgoing:'Bahan Keluar',stock:'Stock Opname',history:'Riwayat Stok',sales:'Penjualan',products:'Produk & Jasa',expenses:'Pengeluaran',reports:'Laporan',settings:'Pengaturan'};
 return map[p]||'Dashboard';
}
function render(){
 document.getElementById('topTitle').textContent=pageTitle(currentPage);
 document.getElementById('todayText').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
 const fn=pages[currentPage]||pages.dashboard;
 document.getElementById('content').innerHTML=fn();
 if(currentPage==='dashboard') drawDashboardChart();
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{currentPage=b.dataset.page;render();document.getElementById('sidebar').classList.remove('open')}));
document.getElementById('mobileToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

const pages={
dashboard:()=>`
<div class="page-head"><div><h2>Dashboard</h2><p>Ringkasan aktivitas BLESSIE PRINTING.</p></div></div>
<div class="grid stats">
 <div class="card"><div class="stat-label">Penjualan Hari Ini</div><div class="stat-value green">${money(todayRevenue())}</div></div>
 <div class="card"><div class="stat-label">Total Pemasukan</div><div class="stat-value blue">${money(allRevenue())}</div></div>
 <div class="card"><div class="stat-label">Total Pengeluaran</div><div class="stat-value red">${money(allExpenses())}</div></div>
 <div class="card"><div class="stat-label">Jumlah Bahan</div><div class="stat-value">${state.materials.length}</div></div>
</div>
<div class="grid quick-grid" style="margin-bottom:18px">
 <button onclick="openMaterialModal()">➕ <b>Tambah Bahan</b><span class="small">Input bahan baru</span></button>
 <button onclick="openSaleModal()">🛒 <b>Catat Penjualan</b><span class="small">Penjualan produk/jasa</span></button>
 <button onclick="openIncomingModal()">📥 <b>Bahan Masuk</b><span class="small">Tambah stok</span></button>
 <button onclick="openExpenseModal()">💸 <b>Pengeluaran</b><span class="small">Catat biaya</span></button>
</div>
<div class="grid two">
 <div class="card"><div class="section-title">📈 Penjualan 7 Hari Terakhir</div><div id="salesChart" class="chart"></div></div>
 <div class="card"><div class="section-title">⚠️ Stok Menipis</div>${lowStockHTML()}</div>
</div>
<div class="card" style="margin-top:18px"><div class="section-title">📋 Aktivitas Terbaru</div>${activityHTML()}</div>
`,

materials:()=>`
<div class="page-head"><div><h2>Bahan Baku</h2><p>Kelola seluruh bahan yang digunakan BLESSIE.</p></div><button class="btn btn-primary" onclick="openMaterialModal()">+ Tambah Bahan</button></div>
<div class="card"><div class="toolbar"><div class="section-title">📦 Daftar Bahan</div><input class="search" placeholder="Cari nama/kategori..." oninput="filterTable(this.value,'materialsTable')"></div>
<div class="table-wrap"><table class="table" id="materialsTable"><thead><tr><th>Nama Bahan</th><th>Kategori</th><th>Satuan</th><th>Stok</th><th>Minimum</th><th>Harga Beli</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${materialsRows()}</tbody></table></div></div>
`,
incoming:()=>`
<div class="page-head"><div><h2>Bahan Masuk</h2><p>Catat pembelian atau penambahan stok bahan.</p></div><button class="btn btn-primary" onclick="openIncomingModal()">+ Bahan Masuk</button></div>
<div class="card"><div class="toolbar"><div class="section-title">📥 Riwayat Bahan Masuk</div><input class="search" placeholder="Cari..." oninput="filterTable(this.value,'incomingTable')"></div>
<div class="table-wrap"><table class="table" id="incomingTable"><thead><tr><th>Tanggal</th><th>Bahan</th><th>Qty</th><th>Harga/Unit</th><th>Total</th><th>Supplier</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>${incomingRows()}</tbody></table></div></div>
`,
outgoing:()=>`
<div class="page-head"><div><h2>Bahan Keluar</h2><p>Catat pemakaian bahan untuk produksi atau kebutuhan lain.</p></div><button class="btn btn-primary" onclick="openOutgoingModal()">+ Bahan Keluar</button></div>
<div class="card"><div class="toolbar"><div class="section-title">📤 Riwayat Bahan Keluar</div><input class="search" placeholder="Cari..." oninput="filterTable(this.value,'outgoingTable')"></div>
<div class="table-wrap"><table class="table" id="outgoingTable"><thead><tr><th>Tanggal</th><th>Bahan</th><th>Qty</th><th>Tujuan</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>${outgoingRows()}</tbody></table></div></div>
`,
stock:()=>`
<div class="page-head"><div><h2>Stock Opname</h2><p>Bandingkan stok sistem dengan stok fisik.</p></div><button class="btn btn-primary" onclick="openOpnameModal()">+ Stock Opname</button></div>
<div class="notice">💡 Stock opname dipakai saat stok fisik berbeda dari stok sistem. Setelah disimpan, perhitungan stok akan memakai jumlah fisik tersebut mulai dari tanggal opname.</div>
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Bahan</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th><th>Catatan</th></tr></thead><tbody>${opnameRows()}</tbody></table></div></div>
`,
history:()=>`
<div class="page-head"><div><h2>Riwayat Stok</h2><p>Semua pergerakan stok bahan.</p></div></div>
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Bahan</th><th>Qty</th><th>Referensi</th><th>Keterangan</th></tr></thead><tbody>${historyRows()}</tbody></table></div></div>
`,
sales:()=>`
<div class="page-head"><div><h2>Penjualan</h2><p>Catat penjualan produk dan jasa BLESSIE.</p></div><button class="btn btn-primary" onclick="openSaleModal()">+ Penjualan Baru</button></div>
<div class="grid stats">
 <div class="card"><div class="stat-label">Omzet</div><div class="stat-value blue">${money(allRevenue())}</div></div>
 <div class="card"><div class="stat-label">Transaksi</div><div class="stat-value">${state.sales.length}</div></div>
 <div class="card"><div class="stat-label">Rata-rata Transaksi</div><div class="stat-value green">${money(state.sales.length?allRevenue()/state.sales.length:0)}</div></div>
 <div class="card"><div class="stat-label">Omzet Hari Ini</div><div class="stat-value green">${money(todayRevenue())}</div></div>
</div>
<div class="card"><div class="toolbar"><div class="section-title">🛒 Daftar Penjualan</div><input class="search" placeholder="Cari pelanggan/produk..." oninput="filterTable(this.value,'salesTable')"></div>
<div class="table-wrap"><table class="table" id="salesTable"><thead><tr><th>Tanggal</th><th>No. Transaksi</th><th>Pelanggan</th><th>Item</th><th>Qty</th><th>Total</th><th>Metode</th><th>Aksi</th></tr></thead><tbody>${salesRows()}</tbody></table></div></div>
`,
products:()=>`
<div class="page-head"><div><h2>Produk & Jasa</h2><p>Master data produk/jasa yang dijual.</p></div><button class="btn btn-primary" onclick="openProductModal()">+ Tambah Produk</button></div>
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Kategori</th><th>Satuan</th><th>Harga Jual</th><th>Modal/HPP</th><th>Margin</th><th>Aksi</th></tr></thead><tbody>${productRows()}</tbody></table></div></div>
`,
expenses:()=>`
<div class="page-head"><div><h2>Pengeluaran</h2><p>Catat biaya operasional, bahan, listrik, internet, dan lainnya.</p></div><button class="btn btn-primary" onclick="openExpenseModal()">+ Pengeluaran</button></div>
<div class="grid stats">
 <div class="card"><div class="stat-label">Total Pengeluaran</div><div class="stat-value red">${money(allExpenses())}</div></div>
 <div class="card"><div class="stat-label">Pengeluaran Hari Ini</div><div class="stat-value red">${money(todayExpenses())}</div></div>
 <div class="card"><div class="stat-label">Jumlah Transaksi</div><div class="stat-value">${state.expenses.length}</div></div>
 <div class="card"><div class="stat-label">Laba Sederhana</div><div class="stat-value green">${money(allRevenue()-allExpenses())}</div></div>
</div>
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Kategori</th><th>Deskripsi</th><th>Nominal</th><th>Metode</th><th>Aksi</th></tr></thead><tbody>${expenseRows()}</tbody></table></div></div>
`,
reports:()=>`
<div class="page-head"><div><h2>Laporan</h2><p>Ringkasan keuangan dan inventory BLESSIE.</p></div><button class="btn btn-light" onclick="exportCSV()">⬇ Export CSV</button></div>
<div class="grid three">
 <div class="card"><div class="section-title">💰 Ringkasan Keuangan</div><p class="kpi">Total Penjualan</p><div class="stat-value blue">${money(allRevenue())}</div><p class="kpi" style="margin-top:12px">Total Pengeluaran</p><div class="stat-value red">${money(allExpenses())}</div><p class="kpi" style="margin-top:12px">Laba Sederhana</p><div class="stat-value green">${money(allRevenue()-allExpenses())}</div></div>
 <div class="card"><div class="section-title">📦 Inventory</div><p class="kpi">Jenis Bahan</p><div class="stat-value">${state.materials.length}</div><p class="kpi" style="margin-top:12px">Bahan Menipis</p><div class="stat-value orange">${lowStockCount()}</div><p class="kpi" style="margin-top:12px">Nilai Stok</p><div class="stat-value blue">${money(stockValue())}</div></div>
 <div class="card"><div class="section-title">🧾 Transaksi</div><p class="kpi">Penjualan</p><div class="stat-value">${state.sales.length}</div><p class="kpi" style="margin-top:12px">Bahan Masuk</p><div class="stat-value">${state.incoming.length}</div><p class="kpi" style="margin-top:12px">Bahan Keluar</p><div class="stat-value">${state.outgoing.length}</div></div>
</div>
<div class="card" style="margin-top:18px"><div class="section-title">📊 Penjualan 7 Hari</div><div id="reportChart" class="chart"></div></div>
`,
settings:()=>`
<div class="page-head"><div><h2>Pengaturan</h2><p>Pengaturan dasar aplikasi dan backup data.</p></div></div>
<div class="grid two">
 <div class="card"><div class="section-title">🏪 Identitas Usaha</div>
  <div class="form-grid">
   <div class="field"><label>Nama Usaha</label><input id="setBusiness" value="${esc(state.settings.businessName)}"></div>
   <div class="field"><label>Minimum Stok Default</label><input id="setMin" type="number" value="${num(state.settings.lowStockDefault)}"></div>
  </div>
  <div class="form-actions"><button class="btn btn-primary" onclick="saveSettings()">Simpan Pengaturan</button></div>
 </div>
 <div class="card"><div class="section-title">💾 Backup & Restore</div>
  <p class="small" style="margin-bottom:12px">Data aplikasi saat ini tersimpan di browser (localStorage). Gunakan backup secara berkala agar data tidak hilang.</p>
  <div class="actions"><button class="btn btn-blue" onclick="backupData()">⬇ Backup JSON</button><label class="btn btn-light">⬆ Restore JSON<input id="restoreInput" type="file" accept=".json" style="display:none" onchange="restoreData(this)"></label><button class="btn btn-danger" onclick="resetData()">Reset Semua Data</button></div>
 </div>
</div>

 state.sales.forEach(x=>rows.push(['Penjualan',x.date,x.item,x.qty,x.total,x.customer]));
 state.expenses.forEach(x=>rows.push(['Pengeluaran',x.date,x.description,'',x.amount,x.category]));
 state.incoming.forEach(x=>{const m=state.materials.find(y=>y.id===x.materialId);rows.push(['Bahan Masuk',x.date,m?.name||'',x.qty,x.qty*x.unitPrice,x.supplier])});
 state.outgoing.forEach(x=>{const m=state.materials.find(y=>y.id===x.materialId);rows.push(['Bahan Keluar',x.date,m?.name||'',x.qty,'',x.destination])});
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`blessie-laporan-${nowDate()}.csv`;a.click();URL.revokeObjectURL(a.href);
}

const oldRender=render;
render=function(){oldRender();if(currentPage==='reports')drawReportChart();}
render();
</script>
</body>
</html>
